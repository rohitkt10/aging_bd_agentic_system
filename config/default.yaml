# Aging BD Agentic System - Default Configuration
# Copy this file and modify as needed.

# =============================================================================
# Top-Level Settings
# =============================================================================

# Output directory for generated files
output_dir: /home/rohitpc/projects/aging_bd_agentic_system/outputs

# Use LLM summarization for research results (reduces context size)
use_llm_summarization: true

# =============================================================================
# LLM Configuration
# =============================================================================

llm:
  # Provider: "vertex" or "openai"
  provider: vertex

  # Model name (provider-specific)
  # Vertex: gemini-2.5-pro, gemini-2.0-flash, gemini-1.5-pro
  # OpenAI: gpt-4o, gpt-4o-mini, gpt-4-turbo
  model: gemini-2.5-pro

  # Generation parameters
  temperature: 0.7
  max_tokens: null  # null = no limit

  # Vertex AI specific
  vertex_location: us-central1

  # OpenAI specific
  openai_base_url: null  # For proxies/Azure

# =============================================================================
# Phase 1: Biological Process Identification
# =============================================================================

phase1:
  # Research plan generation
  min_research_goals: 4
  max_research_goals: 6

  # Search parameters
  vector_db_top_k: 20
  pubmed_retmax: 10

  # Refinement loop
  max_iterations: 2

  # Final output
  max_processes: 15

  # Summarization (when use_llm_summarization=true)
  summary_max_words: 300

# =============================================================================
# Phase 2: Gene Research
# =============================================================================

phase2:
  # Research iterations per biological process
  max_research_iterations: 7

  # Refinement iterations per biological process
  max_refine_iterations: 3

  # Seed gene sources
  genage_seed_max_results: 50
  opengenes_seed_max_results: 50

  # Search parameters
  pubmed_max_results: 5
  vector_db_max_results: 5

# =============================================================================
# Literature Pipeline (Reference Only - corpus is frozen)
# =============================================================================
# These settings are for corpus re-indexing. Not used during normal runs.
# See src/aging_bd_agentic_system/config.py:LiteraturePipelineConfig
#
