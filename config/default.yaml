# Aging BD Agentic System - Default Configuration (Production)
# All parameters with production defaults.

# =============================================================================
# Top-Level Settings
# =============================================================================

hallmark: genomic instability  # Aging hallmark to research
output_dir: outputs  # Output directory for generated files
use_llm_summarization: true  # Use LLM summarization for research results
phase1_only: false  # If true, terminate after Phase 1 (skip gene research)

# =============================================================================
# LLM Configuration
# =============================================================================

llm:
  # Provider: "vertex" or "openai"
  provider: vertex

  # Model name (provider-specific)
  # Vertex: gemini-2.5-pro, gemini-2.0-flash, gemini-1.5-pro
  # OpenAI: gpt-4o, gpt-4o-mini, gpt-4-turbo
  model: gemini-2.5-pro

  # Generation parameters
  temperature: 0.7
  max_tokens: null  # null = no limit

  # Vertex AI specific
  vertex_location: us-central1

  # OpenAI specific
  openai_base_url: null  # For proxies/Azure

# =============================================================================
# Phase 1: Biological Process Identification
# =============================================================================

phase1:
  # Research plan generation
  min_research_goals: 4  # Minimum research goals to generate
  max_research_goals: 6  # Maximum research goals to generate

  # Search parameters
  phase1_vector_db_top_k: 20  # Vector DB results per query
  phase1_pubmed_retmax: 10  # PubMed results per query

  # Refinement loop
  max_iterations: 2  # Max critique/refine loops

  # Final output
  max_processes: 15  # Maximum biological processes to output
  summary_max_words: 300  # Max words per summary in LLM calls

# =============================================================================
# Phase 2: Gene Research
# =============================================================================

phase2:
  # Research loop
  max_research_iterations: 7  # Research iterations per biological process
  max_refine_iterations: 3  # Refinement loops after critic fail
  min_actions_per_iteration: 2  # Minimum actions per research iteration
  max_actions_per_iteration: 4  # Maximum actions per research iteration

  # Seeding
  genage_seed_max_results: 50  # Max GenAge results during seeding
  opengenes_seed_results_per_query: 15  # OpenGenes results per query during seeding

  # Tool limits
  phase2_vector_db_top_k: 10  # Vector DB results per query
  phase2_pubmed_retmax: 10  # PubMed results per query
  opengenes_results_per_query: 20  # OpenGenes results per query during research
  max_opengenes_items_per_field: 5  # Truncate long lists in OpenGenes results

  # Context management
  phase2_summarize_max_tokens: 100000  # Max tokens before context summarization
