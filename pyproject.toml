[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aging-bd-agentic-system"
version = "0.1.0"
description = "Agentic system for aging BD gene list discovery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython==1.86",
    "faiss-cpu==1.13.2",
    "google-genai==1.23.0",
    "langchain-core==1.2.13",
    "langchain-google-vertexai==3.0.0",
    "langchain-openai==1.1.10",
    "langgraph==1.0.9",
    "numpy==1.26.4",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "sentence-transformers==5.2.2",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.9.9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
