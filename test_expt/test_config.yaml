# Test experiment configuration for SLURM-based end-to-end smoke testing
#
# Usage:
#   Phase 1: python test_expt/run_phase1.py
#   Phase 2: python test_expt/run_phase2_bp.py --bp-rank 1
#
# Outputs go to: outputs/test_expt/<hallmark>/

hallmark: "genomic instability"
output_dir: "outputs/test_expt"

llm:
  provider: openai
  model: gpt-5-nano
  temperature: 0.5  

phase1:
  min_research_goals: 2
  max_research_goals: 3
  phase1_vector_db_top_k: 5
  phase1_pubmed_retmax: 5
  max_iterations: 1
  min_processes: 10
  max_processes: 15

phase2:
  # Research loop
  max_research_iterations: 3
  min_actions_per_iteration: 4  
  max_actions_per_iteration: 6  
  # Seeding
  genage_seed_max_results: 10
  opengenes_seed_results_per_query: 15

  # Tool limits
  phase2_vector_db_top_k: 5
  phase2_pubmed_retmax: 5

  # Context management
  phase2_summarize_max_tokens: 50000

  # Critic-refine loop settings
  max_critic_iterations: 1
  refine_opengenes_max_results: 3
  refine_pubmed_max_results: 7   
  refine_vector_db_top_k: 7      
