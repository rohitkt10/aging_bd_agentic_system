# Smoke test config for end-to-end pipeline testing
# Usage: python -m aging_bd_agentic_system.main --config config/test_config.yaml

# =============================================================================
# Top-Level Settings
# =============================================================================

hallmark: genomic instability
output_dir: outputs
use_llm_summarization: true
phase1_only: false  # Run both phases for full smoke test

# =============================================================================
# LLM Configuration
# =============================================================================

llm:
  provider: openai

  # Two-tier model system (both default to model for smoke tests)
  model: gpt-4o-mini
  model_low: null   # If null, uses model
  model_high: null  # If null, uses model_low

  temperature: 0.7
  max_tokens: null
  vertex_location: us-central1
  openai_base_url: null

# =============================================================================
# Phase 1: Biological Process Identification
# =============================================================================

phase1:
  min_research_goals: 2
  max_research_goals: 3
  phase1_vector_db_top_k: 5
  phase1_pubmed_retmax: 5
  max_iterations: 1
  max_processes: 15
  summary_max_words: 300

# =============================================================================
# Phase 2: Gene Research
# =============================================================================

phase2:
  # Research loop (smoke test: reduced)
  max_research_iterations: 3
  max_refine_iterations: 1
  min_actions_per_iteration: 2
  max_actions_per_iteration: 3

  # Seeding (smoke test: reduced)
  genage_seed_max_results: 10
  opengenes_seed_results_per_query: 10

  # Tool limits (smoke test: reduced)
  phase2_vector_db_top_k: 5
  phase2_pubmed_retmax: 5
  opengenes_results_per_query: 10
  max_opengenes_items_per_field: 3

  # Context management
  phase2_summarize_max_tokens: 50000

  # Critic-refine loop settings (smoke test: reduced)
  max_critic_iterations: 1
  refine_opengenes_max_results: 5
  refine_pubmed_max_results: 5
  refine_vector_db_top_k: 5
